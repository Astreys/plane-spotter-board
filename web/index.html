<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Plane Spotter Board — live inbound aircraft</title>
    <meta
      name="description"
      content="A live board of aircraft on approach, filterable by airframe. Answers one question: is something worth driving to the fence for in the next 30 minutes?"
    />
    <link rel="canonical" href="https://plane-spotter-board.netlify.app/" />

    <!-- Dark by default; the board is read outdoors, often at dusk. -->
    <meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Add-to-home-screen behaviour, which is how this actually gets used. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spotter" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plane Spotter Board" />
    <meta property="og:url" content="https://plane-spotter-board.netlify.app/" />
    <meta property="og:title" content="Plane Spotter Board — live inbound aircraft" />
    <meta
      property="og:description"
      content="A live board of aircraft on approach, filterable by airframe. Is something worth driving to the fence for in the next 30 minutes?"
    />
    <meta property="og:image" content="https://plane-spotter-board.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The board listing inbound aircraft with type, callsign, altitude, distance and origin airport."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plane Spotter Board — live inbound aircraft" />
    <meta
      name="twitter:description"
      content="A live board of aircraft on approach, filterable by airframe."
    />
    <meta name="twitter:image" content="https://plane-spotter-board.netlify.app/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      This board updates live and needs JavaScript. It reads a cached snapshot from the
      server, so it never hammers the ADS-B feed.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
